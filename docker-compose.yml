version: "3"

volumes:
  cacheData:
    external: true
  dbData:
    external: true

services:
  cache:
    restart: unless-stopped
    image: redis:7.0.7-alpine
    command: redis-server --loglevel warning
    ports:
      - 6379:6379
    volumes:
      - cacheData:/data
    container_name: Cache
  postgres:
      restart: unless-stopped
      image: postgres:15.2-alpine
      environment:
        - POSTGRES_USER=disstat
        - POSTGRES_PASSWORD=AQwrMb4WzngykR9v
        - POSTGRES_DB=disstat
      ports:
        - 5432:5432
      volumes:
        - ./schema.postgresql.sql:/docker-entrypoint-initdb.d/schema.postgresql.sql:ro
        - dbData:/var/lib/postgresql/data
      container_name: DB
  
  app:
    restart: unless-stopped
    build: 
      context: ./siteSrc
      dockerfile: Dockerfile
    container_name: app
    depends_on:
      - postgres
      - cache
  oldrewrite:
    restart: unless-stopped
    build: 
      context: ./v3reWrite
      dockerfile: Dockerfile
    container_name: oldrewrite
    volumes:
      - ./tasks/config:/config
    depends_on:
      - postgres
      - cache
  nginx:
    restart: unless-stopped
    image: 'nginx:alpine'
    volumes:
      - './nginx.conf:/etc/nginx/nginx.conf'
    container_name: nginx
    ports:
      - 80:80
    depends_on:
      - app
      - oldrewrite

  bot:
    restart: unless-stopped
    build: 
      context: ./bot
      dockerfile: Dockerfile
    container_name: bot
    depends_on:
      - postgres
      - cache

  tasks:
    restart: unless-stopped
    build: 
      context: ./tasks
      dockerfile: Dockerfile
    container_name: tasks
    depends_on:
      - postgres
      - cache